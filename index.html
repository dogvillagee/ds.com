<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hi — ds.com</title>
<style>
  :root {
    --bg: #0f0a1f;
    --green: #39ff14;
    --purple: #b026ff;
    --ink: #f5f0ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, sans-serif;
    background: radial-gradient(circle at 30% 20%, #1a1033 0%, var(--bg) 60%);
    color: var(--ink);
  }
  .card {
    text-align: center;
    padding: 3rem 2.5rem;
    border: 1px solid rgba(176, 38, 255, 0.4);
    border-radius: 16px;
    background: rgba(15, 10, 31, 0.6);
    box-shadow: 0 0 40px rgba(57, 255, 20, 0.15);
  }
  h1 {
    margin: 0 0 0.5rem;
    font-size: clamp(3rem, 12vw, 6rem);
    letter-spacing: 0.04em;
    background: linear-gradient(90deg, var(--green), var(--purple));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  p { margin: 0; color: #c9b8ef; }
</style>
</head>
<body>
  <div class="card">
    <h1>hi</h1>
    <p>you found ds.com</p>
  </div>
</body>
</html>
